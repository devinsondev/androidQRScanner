name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-windows-wrapper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle Wrapper checksums and URL on Windows
        shell: pwsh
        run: .\scripts\verify-gradle-wrapper.ps1

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests with verified dependencies
        run: ./gradlew --dependency-verification strict testDebugUnitTest
      - name: Assemble debug APK with verified dependencies
        run: ./gradlew --dependency-verification strict assembleDebug
